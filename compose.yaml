name: my-vue3

services:
  web: #service ย่อย ตั้งชื่อตามโปรเจค เช่น backend frontend
    build: .
    image: my-vue3-image #ตั้งชื่อ image ไม่ใส่ก็ได้
    container_name: my-vue3-con #ตั้งชื่อ container ไม่ใส่ก็ได้
    ports:
      - "5173:5173"
    volumes: 
      - .:/app
      - /app/node_modules

